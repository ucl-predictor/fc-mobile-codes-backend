name: Update FC Mobile Codes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-fc-mobile-codes
  cancel-in-progress: false

jobs:
  update-codes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update codes
        run: python scripts/update_codes.py

      - name: Save changes
        run: |
          git config user.name "FC Codes Bot"
          git config user.email "actions@users.noreply.github.com"
          git add codes.json

          if git diff --cached --quiet; then
            echo "No changes to codes.json"
            exit 0
          fi

          git commit -m "Update FC Mobile codes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
