name: Update FC Mobile Codes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update codes
        run: python scripts/update_codes.py

      - name: Save changes
        run: |
          git config user.name "FC Codes Bot"
          git config user.email "actions@users.noreply.github.com"
          git add codes.json
          git diff --cached --quiet || git commit -m "Update FC Mobile codes"
          git push
